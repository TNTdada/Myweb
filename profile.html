<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人详情 | 扫雷</title>
  <link rel="stylesheet" href="assets/css/style.css?v=20260609c">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="assets/js/theme.js" defer></script>
  <script src="assets/js/supabaseClient.js?v=20260609b" defer></script>
  <script src="assets/js/feedback.js?v=20260609a" defer></script>
  <script src="assets/js/account.js?v=20260609c" defer></script>
  <script src="assets/js/profile.js?v=20260609b" defer></script>
</head>
<body class="profile-page">
  <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换深色模式" title="切换深色模式">
    <span data-theme-icon>☾</span>
  </button>

  <main class="profile-shell">
    <header class="profile-header">
      <div>
        <p class="eyebrow">Player Profile</p>
        <h1 id="profileName">个人详情</h1>
      </div>
      <div class="profile-actions">
        <a class="ghost-button" href="edit-profile.html">修改信息</a>
        <a class="ghost-button" href="index.html">返回首页</a>
      </div>
    </header>

    <section class="profile-summary">
      <div>
        <span>账户名</span>
        <strong id="profileUsername">-</strong>
      </div>
      <div>
        <span>注册时间</span>
        <strong id="profileCreatedAt">-</strong>
      </div>
      <div>
        <span>上次登录</span>
        <strong id="profileLastSignIn">-</strong>
      </div>
    </section>

    <section class="level-card" aria-label="等级进度">
      <div>
        <span>等级</span>
        <strong id="statLevel">Lv.1</strong>
      </div>
      <div class="level-meta">
        <span id="statLevelProgress">0/3000 XP</span>
        <span>距下一级 <strong id="statXpToNext">3000</strong> XP</span>
      </div>
      <div class="xp-progress"><span id="profileXpBar"></span></div>
      <span id="statTotalXp">总 XP 0</span>
    </section>

    <section class="stats-grid stats-categories" id="statsCategories" aria-label="游戏统计">
      <article class="stat-category-card"><h2>正在读取统计</h2></article>
    </section>

    <p class="profile-message" id="profileMessage">正在读取数据</p>
  </main>
</body>
</html>
