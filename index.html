<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>扫雷 | Minefield</title>
  <link rel="stylesheet" href="assets/css/style.css?v=20260608b">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="assets/js/theme.js" defer></script>
  <script src="assets/js/supabaseClient.js?v=20260608b" defer></script>
  <script src="assets/js/account.js?v=20260608b" defer></script>
</head>
<body class="home-page">
  <button class="theme-toggle" type="button" data-theme-toggle aria-label="切换深色模式" title="切换深色模式">
    <span data-theme-icon>☾</span>
  </button>
  <div class="account-widget">
    <button class="account-button" id="accountButton" type="button">未登录</button>
    <section class="account-panel" id="accountPanel" hidden aria-label="账户数据面板">
      <div class="account-panel-heading">
        <strong id="accountPanelName">未登录</strong>
        <span id="accountPanelStatus">登录后记录游戏数据</span>
      </div>
      <dl class="mini-stats">
        <div>
          <dt>游戏局数</dt>
          <dd id="miniGames">0</dd>
        </div>
        <div>
          <dt>胜场</dt>
          <dd id="miniWins">0</dd>
        </div>
        <div>
          <dt>最高分</dt>
          <dd id="miniBestScore">0</dd>
        </div>
        <div>
          <dt>总时长</dt>
          <dd id="miniTotalTime">0s</dd>
        </div>
      </dl>
      <div class="account-actions">
        <a class="ghost-button" href="profile.html">详细信息</a>
        <button class="ghost-button" id="signOutButton" type="button">退出</button>
      </div>
    </section>
  </div>

  <main class="home-shell">
    <section class="home-hero" aria-labelledby="home-title">
      <p class="eyebrow">Classic Minesweeper</p>
      <h1 id="home-title">扫雷</h1>
      <p class="hero-copy">选择难度，翻开所有安全格，避开隐藏的地雷。</p>
    </section>

    <section class="difficulty-panel" aria-labelledby="difficulty-title">
      <div class="panel-heading">
        <h2 id="difficulty-title">选择难度</h2>
        <p>首次点击后开始计时，并保证第一格安全。</p>
      </div>

      <a class="daily-button" href="daily.html" aria-label="进入每日挑战">每日<br>挑战</a>

      <form class="difficulty-form" id="difficultyForm">
        <label class="difficulty-card">
          <input type="radio" name="difficulty" value="beginner" checked>
          <span class="difficulty-name">初级</span>
          <span class="difficulty-meta">9 x 9 · 10 雷</span>
        </label>

        <label class="difficulty-card">
          <input type="radio" name="difficulty" value="intermediate">
          <span class="difficulty-name">中级</span>
          <span class="difficulty-meta">16 x 16 · 40 雷</span>
        </label>

        <label class="difficulty-card">
          <input type="radio" name="difficulty" value="expert">
          <span class="difficulty-name">高级</span>
          <span class="difficulty-meta">30 x 16 · 99 雷</span>
        </label>
        <button class="primary-button" type="submit">开始游戏</button>
      </form>
    </section>
  </main>

  <script>
    document.getElementById("difficultyForm").addEventListener("submit", function (event) {
      event.preventDefault();
      const formData = new FormData(event.currentTarget);
      const difficulty = formData.get("difficulty") || "beginner";
      window.location.href = `game.html?difficulty=${encodeURIComponent(difficulty)}`;
    });
  </script>
</body>
</html>
